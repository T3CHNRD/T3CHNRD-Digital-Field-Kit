name: Source Package
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source package
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=FK/ --output=artifacts/FK.zip HEAD
          python -c "import zipfile; z=zipfile.ZipFile('artifacts/FK.zip'); assert max(map(len,z.namelist())) <= 160, 'Portable ZIP path budget exceeded'"
      - uses: actions/upload-artifact@v4
        with:
          name: FK-Portable
          path: artifacts/FK.zip
