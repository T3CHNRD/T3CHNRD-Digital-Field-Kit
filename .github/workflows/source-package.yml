name: Source Package
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source package
        run: |
          mkdir -p artifacts
          zip -r artifacts/T3CHNRD-Digital-Field-Kit-Source.zip . -x '.git/*' 'artifacts/*'
      - uses: actions/upload-artifact@v4
        with:
          name: T3CHNRD-Digital-Field-Kit-Source
          path: artifacts/T3CHNRD-Digital-Field-Kit-Source.zip
