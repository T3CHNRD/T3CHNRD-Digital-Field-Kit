name: v11 Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native Windows app
        shell: powershell
        run: |
          dotnet build .\src\T3DFK.App\T3DFK.App.csproj -c Release
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Publish self-contained Windows app
        shell: powershell
        run: |
          dotnet publish .\src\T3DFK.App\T3DFK.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\dist\windows-x64
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: T3DFK-v11-Windows-x64
          path: dist/windows-x64/T3DFK.exe
