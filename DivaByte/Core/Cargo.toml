[package]
name = "divabyte-core"
version = "0.2.0"
edition = "2021"
description = "DivaByte local-first diagnostic core for T3CHNRD Digital Field Kit"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
